name: ci

on:
  push:
  pull_request:

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Start Oracle Database 23ai Free
        uses: gvenzl/setup-oracle-free@v1
        with:
          tag: 23
          oracle-password: billrun
          app-user: billrun
          app-user-password: billrun

      - name: Install, test and benchmark
        run: ./scripts/ci.sh

      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: build/coverage.xml
          if-no-files-found: ignore
